name: Repair regression checks
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node Scripts/test_account_rules.mjs
      - run: node Scripts/test_saved_content.mjs
      - run: node Scripts/test_search_parity.mjs
      - run: npm ci --ignore-scripts
      - run: npm run test:sync
      - run: node Scripts/test_quest_web_sync.mjs
      - run: node Scripts/test_taxonomy_sync.mjs
      - run: node Scripts/test_open_signals.mjs
      - run: node Scripts/test_library_layout.mjs
      - run: node Scripts/test_quest_presentation.mjs
      - run: node Scripts/test_grounded_briefs.mjs
      - run: node Scripts/test_enrichment.mjs
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swiftc -parse-as-library Core/SavedContent.swift Scripts/test_saved_content.swift -o /tmp/content-tests && /tmp/content-tests
      - run: swiftc -parse-as-library Core/Supabase.swift Core/QuestSyncRecord.swift Scripts/test_quest_sync.swift -o /tmp/quest-sync-tests && /tmp/quest-sync-tests
      - run: bash Scripts/test_native.sh
