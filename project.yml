# XcodeGen config — regenerate the Xcode project with: xcodegen generate
#
# Device signing: to run on a real iPhone or ship to TestFlight, put your Apple
# Team ID below under settings.base.DEVELOPMENT_TEAM (Xcode > Settings >
# Accounts shows it; team IDs are not secret). Setting it HERE makes it survive
# project regeneration — picking the team inside Xcode instead gets wiped every
# time xcodegen runs.
#
# The App Group (group.com.jpwilson.borkmarkr) must exist on your developer
# account for the Share Extension to hand saves to the app. Xcode's automatic
# signing creates it on first device build.
name: borkmarkr
options:
  bundleIdPrefix: com.jpwilson
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

settings:
  base:
    DEVELOPMENT_TEAM: 7RUN765V47
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "17"

targets:
  borkmarkr:
    type: application
    platform: iOS
    # Core/ holds the SwiftData model + taxonomy + categorizer and is compiled
    # into BOTH targets — the Share Extension writes straight into the same
    # App Group store the app reads.
    sources: [App, Core]
    scheme:
      testTargets: [bookmarkerTests, bookmarkerUITests]
    settings:
      base:
        # iPhone only. XcodeGen's per-target default is "1,2", which overrides
        # the project-level value and makes App Store validation demand iPad
        # multitasking orientations.
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: ShareExtension
        embed: true
    entitlements:
      path: App/borkmarkr.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jpwilson.borkmarkr
        # The app's own application identifier: already its default keychain
        # group and where the signed-in session has always been written, now
        # listed so the Share Extension can borrow it (Core/SessionKeychain.swift).
        # Nothing may ever be listed ahead of it. The first entry is where the
        # app writes, and anything else there moves the session.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jpwilson.borkmarkr
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: bookmarker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Only standard TLS (URLSession over HTTPS) — exempt from export compliance.
        # Answers App Store Connect's encryption question once, here, instead of on
        # every single upload.
        ITSAppUsesNonExemptEncryption: false
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - BricolageGrotesque.ttf
          - InstrumentSans.ttf
        # Opening a saved link back out to its source app
        LSApplicationQueriesSchemes:
          - instagram
          - twitter
          - tiktok
          - youtube
        # A shared collection opened into the app: bookmarker://c/<slug>
        # (Core/CollectionShare.swift parses it; RootView presents it). A
        # custom scheme rather than a universal link for now — universal
        # links need an associated-domains entitlement, which changes the
        # provisioning profile of a build currently held in review.
        CFBundleURLTypes:
          - CFBundleURLName: com.jpwilson.borkmarkr.collection
            CFBundleURLSchemes:
              - bookmarker

  bookmarkerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: borkmarkr
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jpwilson.borkmarkr.tests

  # Drives the real app: scroll smoothness and layout on a heavy library.
  # Uses the DEBUG `-seed -layoutStress` fixture, so no private data.
  bookmarkerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: borkmarkr
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jpwilson.borkmarkr.uitests
        TEST_TARGET_NAME: borkmarkr
        # XCUITest's API predates strict concurrency; Swift 6 mode turns every
        # query in a measure block into an isolation error.
        SWIFT_VERSION: "5.0"

  ShareExtension:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Core]
    settings:
      base:
        # Must nest under the app's identifier or the embed step fails.
        PRODUCT_BUNDLE_IDENTIFIER: com.jpwilson.borkmarkr.ShareExtension
        TARGETED_DEVICE_FAMILY: "1"
        # `#if !SHARE_EXTENSION` keeps refreshing, saving and clearing the
        # signed-in session out of the extension, which only borrows it.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SHARE_EXTENSION"
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jpwilson.borkmarkr
        # The app's group, the only entry, never anything ahead of it (see the
        # app's entitlements): the extension reads the session from there.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jpwilson.borkmarkr
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Save to bookmarker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Only standard TLS (URLSession over HTTPS) — exempt from export compliance.
        # Answers App Store Connect's encryption question once, here, instead of on
        # every single upload.
        ITSAppUsesNonExemptEncryption: false
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The same server as the app, for asking the AI while the dial is up.
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
