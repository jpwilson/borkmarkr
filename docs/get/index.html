<style>
  :root { --paper: #F6F3EE; --ink: #191510; --ink-2: #5B554D; --coral: #FF5A2D; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--paper); color: var(--ink);
    font: 16px/1.5 "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; text-align: center; padding: 24px; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 22px; margin: 16px 0 6px; }
  p { color: var(--ink-2); margin: 0 0 18px; max-width: 34ch; }
  a.btn { display: inline-block; background: var(--coral); color: #fff; font-weight: 700; padding: 12px 22px; border-radius: 999px; text-decoration: none; }
  a.alt { display: block; margin-top: 14px; color: var(--ink-2); font-size: 14px; }
</style>
</head>
<body>
<!-- A share link that carries our own card instead of Apple's. Link scrapers
     (iMessage, WhatsApp, X, Slack) read the tags above and stop; people get
     sent on by the script: iPhone → App Store, everyone else → the web app. -->
<main>
  <img src="/img/mark-192.png" alt="">
  <h1>bookmarker</h1>
  <p>Taking you to the App Store…</p>
  <a class="btn" id="go" href="https://apps.apple.com/app/id6799805479">Open in the App Store</a>
  <a class="alt" id="web" href="/">Or use it on the web</a>
</main>
<script>
  (function () {
    var store = "https://apps.apple.com/app/id6799805479";
    var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) && !window.MSStream;
    // Keep any ?utm_… so PostHog on the web app still knows where the tap came from.
    var web = "/" + (location.search || "");
    document.getElementById("web").href = web;
    if (!ios) { document.getElementById("go").textContent = "Open bookmarker"; document.getElementById("go").href = web; }
    setTimeout(function () { location.replace(ios ? store : web); }, 60);
  })();
</script>
</body>
</html>
