<!-- GitHub Pages serves this file for every path it does not have, which is
     what makes it the right place for the interim shared-collection route.

     A shared link is `bookmarker.lol/c/<slug>`. The page that answers it lives
     in an Edge Function, and the *real* wiring is a Cloudflare Worker in front
     of the domain rewriting /c/* onto it (see cloudflare/README.md) — that is
     what makes an unfurl work, because a link scraper reads the HTML the
     server returned and does not run any of this.

     Until that is switched on, this fetches the same function and writes its
     HTML into the page. A person who taps a shared link today gets the
     collection; the card in Messages stays the generic one until the Worker
     is live. Everything else falls through to an ordinary 404. -->
<main id="fallback">
  <a href="/"><img src="/img/mark-192.png" alt=""></a>
  <h1>Page not found</h1>
  <p>That address doesn’t exist on bookmarker.</p>
  <p><a class="btn" href="/">Open bookmarker</a></p>
  <p class="hint"><a href="/get">Get the app</a> · <a href="/privacy">Privacy</a></p>
</main>
<script>
  (function () {
    var m = /^\/c\/([a-z0-9]{8,16})\/?$/.exec(location.pathname);
    if (!m) return;

    // Say nothing while we wait: a flash of "Page not found" before the
    // collection appears is worse than a blank second.
    document.getElementById("fallback").hidden = true;

    fetch("https://pcjuxnhqxyfvgagnblzv.supabase.co/functions/v1/collection-page?slug=" + m[1])
      .then(function (r) { return r.text(); })
      .then(function (html) {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function () {
        // The network, not the link. Give the reader the page back rather
        // than a blank screen.
        document.getElementById("fallback").hidden = false;
      });
  })();
</script>
