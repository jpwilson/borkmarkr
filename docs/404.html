<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Page not found — bookmarker</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --paper: #F6F3EE; --surface: #FFFFFF; --ink: #191510; --ink-2: #5B554D;
    --faint: #A39A8D; --hairline: #EAE4DA; --coral: #FF5A2D;
    --font-head: "Bricolage Grotesque", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-body: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center;
    background: var(--paper); color: var(--ink); font: 16px/1.6 var(--font-body);
    text-align: center; padding: 24px; }
  img { width: 64px; height: 64px; border-radius: 16px; }
  h1 { font-family: var(--font-head); font-size: 26px; margin: 18px 0 6px; letter-spacing: -.02em; }
  p { color: var(--ink-2); margin: 0 0 20px; max-width: 34ch; }
  a.btn { display: inline-block; background: var(--coral); color: #fff; font-weight: 700;
    padding: 12px 22px; border-radius: 999px; }
  a { color: inherit; text-decoration: none; }
  .hint { color: var(--faint); font-size: 13px; margin-top: 22px; }
</style>
</head>
<body>
<!-- GitHub Pages serves this file for every path it does not have, which is
     what makes it the right place for the interim shared-collection route.

     A shared link is `bookmarker.lol/c/<slug>`. The page that answers it lives
     in an Edge Function, and the *real* wiring is a Cloudflare Worker in front
     of the domain rewriting /c/* onto it (see cloudflare/README.md) — that is
     what makes an unfurl work, because a link scraper reads the HTML the
     server returned and does not run any of this.

     Until that is switched on, this fetches the same function and writes its
     HTML into the page. A person who taps a shared link today gets the
     collection; the card in Messages stays the generic one until the Worker
     is live. Everything else falls through to an ordinary 404. -->
<main id="fallback">
  <a href="/"><img src="/img/mark-192.png" alt=""></a>
  <h1>Page not found</h1>
  <p>That address doesn’t exist on bookmarker.</p>
  <p><a class="btn" href="/">Open bookmarker</a></p>
  <p class="hint"><a href="/get">Get the app</a> · <a href="/privacy">Privacy</a></p>
</main>
<script>
  (function () {
    var m = /^\/c\/([a-z0-9]{8,16})\/?$/.exec(location.pathname);
    if (!m) return;

    // Say nothing while we wait: a flash of "Page not found" before the
    // collection appears is worse than a blank second.
    document.getElementById("fallback").hidden = true;

    fetch("https://pcjuxnhqxyfvgagnblzv.supabase.co/functions/v1/collection-page?slug=" + m[1])
      .then(function (r) { return r.text(); })
      .then(function (html) {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function () {
        // The network, not the link. Give the reader the page back rather
        // than a blank screen.
        document.getElementById("fallback").hidden = false;
      });
  })();
</script>
</body>
</html>
